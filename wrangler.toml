# Cloudflare Worker for the Hololand AI features (code in worker/src/index.js).
# Cloudflare builds and deploys this automatically on every push to main.
# The name must match the Worker's name in the Cloudflare dashboard.
name = "hololand"
main = "worker/src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
# Where the Worker reads the catalogue/FAQ. The github.io address keeps working
# after the custom domain is on (GitHub redirects it), so it never breaks.
SITE_URL = "https://upliftdigitalpartners.github.io/hololand"
# Extra websites allowed to use the AI and admin (the custom domain).
ALLOWED_ORIGINS = "https://hololandbd.com,https://www.hololandbd.com"
CHAT_MODEL = "openai/gpt-oss-120b"
VISION_MODEL = "qwen/qwen3.6-27b"
STT_MODEL = "whisper-large-v3"
GITHUB_REPO = "upliftdigitalpartners/hololand"
GITHUB_BRANCH = "main"

# Per-visitor rate limits, enforced by Cloudflare across all its servers.
[[ratelimits]]
name = "AI_LIMIT"          # AI features: 20 requests / minute / visitor
namespace_id = "1001"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "LOGIN_LIMIT"       # admin login: 5 attempts / minute / visitor
namespace_id = "1002"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "TRACK_LIMIT"       # anonymous page-view stats: 60 events / minute / visitor
namespace_id = "1003"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "ORDER_LIMIT"       # checkout form: 8 tries / minute / visitor
namespace_id = "1004"
simple = { limit = 8, period = 60 }

# Anonymous site stats (admin → Stats), stored in a SQLite-backed Durable Object.
[[durable_objects.bindings]]
name = "STATS"
class_name = "Stats"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Stats"]

# Orders from the checkout form (admin → Orders).
[[durable_objects.bindings]]
name = "ORDERS"
class_name = "Orders"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Orders"]

# Secrets are added in the dashboard (Settings → Variables and Secrets), never here:
#   GROQ_API_KEY  (your gsk_… key)
#   ADMIN_TOKEN   (the admin password for admin.html)
#   GITHUB_TOKEN  (fine-grained GitHub token, Contents: read and write, for publishing admin edits)
#   TELEGRAM_BOT_TOKEN  (optional: from @BotFather, for new-order alerts; phones are connected in the admin)
