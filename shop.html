<body class="is-loading" data-page="shop">
  <div class="curtain" aria-hidden="true"><svg class="curtain__mark" viewBox="0 0 345 400"><polygon class="m-a" points="0,0 105,0 105,140 0,212" /><polygon class="m-b" points="0,245 215,98 215,300 110,300 110,400 0,400" /><rect class="m-c" x="238" y="0" width="107" height="400" /></svg></div>
  <main class="page page--shop">
    <section class="page-hero page-hero--compact">
      <nav class="crumbs" data-hero-in aria-label="Breadcrumb"><a href="./">Home</a><span>/</span><span data-crumb>Shop</span></nav>
      <h1 class="page-title" data-hero-in data-shop-title>The full <em>edit</em></h1>
      <p class="page-lede" data-hero-in data-shop-lede>Festive panjabis and soft winter knits, designed in Chittagong.</p>
    </section>

    <div class="shopbar" data-hero-in>
      <div class="tabs" role="tablist" data-tabs>
      </div>
      <div class="shopbar__right">
        <span class="shopbar__count mono" data-count></span>
        <button class="btn btn--ghost btn--sm filters-btn" data-filters-open><span>Filters</span> <b data-filters-badge></b></button>
        <label class="select"><span class="sr-only">Sort</span>
          <select data-sort>
            <option value="featured">Featured</option>
            <option value="low">Price: low to high</option>
            <option value="high">Price: high to low</option>
            <option value="name">Name A–Z</option>
          </select>
        </label>
      </div>
    </div>

    <div class="shop-layout">
      <aside class="filters" data-filters data-lenis-prevent aria-label="Filters">
        <div class="filters__head"><h2>Filters</h2><button class="icon-btn filters__close" data-filters-close aria-label="Close">✕</button></div>
        <div class="filters__group"><h3>Occasion</h3><div class="chips" data-f-occasion></div></div>
        <div class="filters__group"><h3>Colour</h3><div class="swatches" data-f-colour></div></div>
        <div class="filters__group"><h3>Price</h3><div class="chips" data-f-price></div></div>
        <button class="link-btn" data-f-clear>Clear all filters</button>
        <button class="btn btn--solid btn--wide filters__apply" data-filters-close><span>Show results</span></button>
      </aside>
      <div>
        <div class="grid grid--shop" data-grid></div>
        <div class="empty" data-empty hidden>
          <h3>Nothing matches <em>just yet.</em></h3>
          <p>Try removing a filter, or ask our stylist to find something for you.</p>
          <div class="empty__cta"><button class="btn btn--ghost btn--sm" data-f-clear><span>Clear filters</span></button><a class="btn btn--solid btn--sm" href="stylist.html"><span>Ask our stylist</span></a></div>
        </div>
      </div>
    </div>
  </main>
  <script src="assets/vendor/gsap.min.js"></script>

  <script src="assets/vendor/SplitText.min.js"></script>
  <script src="assets/vendor/lenis.min.js"></script>

</body>
