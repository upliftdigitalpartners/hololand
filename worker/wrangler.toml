# Only needed if you deploy from the command line (npx wrangler deploy).
# Using the Cloudflare dashboard instead? See SETUP-GROQ.md; you can ignore this file.
name = "hololand-ai"
main = "src/index.js"
compatibility_date = "2026-09-01"

[vars]
SITE_URL = "https://upliftdigitalpartners.github.io/hololand"
CHAT_MODEL = "openai/gpt-oss-120b"
VISION_MODEL = "qwen/qwen3.6-27b"
STT_MODEL = "whisper-large-v3"

# Secrets, never written here:
#   npx wrangler secret put GROQ_API_KEY
#   npx wrangler secret put ADMIN_TOKEN
