<body class="is-loading" data-page="track">
  <div class="curtain" aria-hidden="true"><svg class="curtain__mark" viewBox="0 0 345 400"><polygon class="m-a" points="0,0 105,0 105,140 0,212" /><polygon class="m-b" points="0,245 215,98 215,300 110,300 110,400 0,400" /><rect class="m-c" x="238" y="0" width="107" height="400" /></svg></div>
  <main class="page page--track">
    <section class="page-hero page-hero--compact">
      <nav class="crumbs" data-hero-in aria-label="Breadcrumb"><a href="./">Home</a><span>/</span><a href="help.html">Help</a><span>/</span><span>Track your order</span></nav>
      <h1 class="page-title" data-hero-in>Track your <em>order</em></h1>
      <p class="page-lede" data-hero-in>Enter your order number (it starts with HL-) and the phone number you ordered with.</p>
    </section>

    <section class="track">
      <form class="track__form" data-track-form novalidate data-hero-in>
        <label class="cf"><span>Order number</span><input name="id" placeholder="HL-250925-001" autocapitalize="characters" autocomplete="off" maxlength="20" required /></label>
        <label class="cf"><span>Phone number</span><input name="phone" type="tel" inputmode="tel" placeholder="01XXXXXXXXX" autocomplete="tel" maxlength="20" required /></label>
        <button class="btn btn--solid btn--wide" data-track-go><span>Check status</span></button>
        <p class="checkout__err" data-track-err role="alert" hidden></p>
      </form>

      <div class="track__result" data-track-result hidden aria-live="polite">
        <div class="track__head">
          <div><span class="mono" data-t-id></span><h2 data-t-headline></h2><p data-t-sub></p></div>
        </div>
        <ol class="track__steps" data-t-steps></ol>
        <div class="track__courier" data-t-courier hidden></div>
        <div class="track__items" data-t-items></div>
        <p class="track__help">Questions about your order? <a href="help.html">Contact us</a>.</p>
      </div>
    </section>
  </main>
