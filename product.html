<body class="is-loading" data-page="product">
  <div class="curtain" aria-hidden="true"><svg class="curtain__mark" viewBox="0 0 345 400"><polygon class="m-a" points="0,0 105,0 105,140 0,212" /><polygon class="m-b" points="0,245 215,98 215,300 110,300 110,400 0,400" /><rect class="m-c" x="238" y="0" width="107" height="400" /></svg></div>
  <main class="page page--product">
    <nav class="crumbs pdp-crumbs" data-hero-in aria-label="Breadcrumb"><a href="./">Home</a><span>/</span><a href="shop.html">Shop</a><span>/</span><a data-crumb-cat href="shop.html"></a><span>/</span><span data-crumb-name></span></nav>
    <section class="pdp" data-pdp>
      <div class="pdp__gallery" data-hero-in>
        <div class="pdp__main arch" data-zoom><img data-pdp-img alt="" /></div>
        <div class="pdp__thumbs" data-pdp-thumbs></div>
      </div>
      <div class="pdp__info" data-sizer-root>
        <div class="pdp__sticky">
          <span class="mono" data-pdp-code></span>
          <h1 class="pdp__name" data-pdp-name></h1>
          <div class="pdp__price-row"><span class="pdp__price" data-pdp-price></span><span class="pdp__rating" data-pdp-rating></span></div>
          <div class="qv__lang" data-pdp-lang hidden><button class="is-active" data-plang="en">EN</button><button data-plang="bn">বাংলা</button></div>
          <p class="pdp__desc" data-pdp-desc></p>
          <dl class="pdp__meta">
            <div><dt>Colour</dt><dd><span class="swatch" data-pdp-swatch></span> <span data-pdp-colour></span></dd></div>
            <div><dt>Fabric</dt><dd data-pdp-fabric></dd></div>
            <div><dt>Category</dt><dd data-pdp-type></dd></div>
          </dl>
          <div data-pdp-sizer></div>
          <div class="pdp__actions">
            <button class="btn btn--solid btn--wide" data-pdp-add><span>Add to bag</span></button>
            <a class="btn btn--ghost btn--wide" data-pdp-ask target="_blank" rel="noopener"><span>Ask about this on WhatsApp</span></a>
          </div>
          <p class="pdp__note" data-delivery-note></p>
          <div class="accordion">
            <details><summary>Delivery &amp; payment</summary><div data-pdp-delivery></div></details>
            <details><summary>Exchanges</summary><div data-pdp-exchange></div></details>
            <details><summary>Care</summary><div data-pdp-care></div></details>
          </div>
          <div class="reviews" data-pdp-reviews hidden></div>
        </div>
      </div>
    </section>
    <section class="related">
      <div class="section-head section-head--row">
        <h2 class="h2" data-split>You may <em>also like</em></h2>
        <a href="shop.html" class="link-arrow">Shop all <i>→</i></a>
      </div>
      <div class="grid" data-related></div>
    </section>
    <div class="pdp-bar" data-pdp-bar>
      <div><strong data-bar-name></strong><span data-bar-price></span></div>
      <button class="btn btn--solid btn--sm" data-bar-add><span>Add to bag</span></button>
    </div>
    <section class="notfound" data-notfound hidden>
      <h1 class="page-title">We couldn’t find <em>that piece.</em></h1>
      <p class="page-lede">It may be sold out or no longer available.</p>
      <a href="shop.html" class="btn btn--solid"><span>Browse the shop</span></a>
    </section>
  </main>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="assets/vendor/ScrollTrigger.min.js"></script>
  <script src="assets/vendor/SplitText.min.js"></script>
  <script src="assets/vendor/lenis.min.js"></script>
  <script type="module" src="assets/js/pages/product.js"></script>
</body>
</html>
